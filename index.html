<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>누구지: 누군가 구할 때까지, 지구를</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700&family=Noto+Sans+Thai:wght@400;700&family=Inter:wght@400;900&display=swap');
        
        body {
            font-family: 'Noto Sans KR', 'Noto Sans Thai', 'Inter', sans-serif;
            background-color: #020617;
            color: #f8fafc;
            margin: 0;
            overflow-x: hidden;
        }

        .title-font { font-family: 'Black Han Sans', sans-serif; }

        .option-btn {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .option-btn:hover {
            background: rgba(51, 65, 85, 0.9);
            transform: translateY(-2px);
            border-color: rgba(52, 211, 153, 0.5);
        }

        .animal-slot {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem;
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .status-3 { background: rgba(52, 211, 153, 0.15); border: 1px solid rgba(52, 211, 153, 0.4); transform: scale(1.1); } 
        .status-2 { background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, 0.3); } 
        .status-1 { background: rgba(251, 191, 36, 0.1); border: 1px solid rgba(251, 191, 36, 0.3); filter: saturate(0.7); } 
        .status-0 { background: rgba(244, 63, 94, 0.1); border: 1px solid rgba(244, 63, 94, 0.3); filter: grayscale(1) opacity(0.3); transform: scale(0.9); } 

        .earth-glow {
            width: 180px; height: 180px;
            border-radius: 50%;
            margin: 0 auto;
            transition: all 1s ease;
            display: flex; align-items: center; justify-content: center;
            font-size: 5rem;
        }
        .earth-green { background: radial-gradient(circle, #10b981 0%, #064e3b 100%); box-shadow: 0 0 40px rgba(16, 185, 129, 0.4); }
        .earth-red { background: radial-gradient(circle, #f43f5e 0%, #7f1d1d 100%); box-shadow: 0 0 50px rgba(244, 63, 94, 0.5); animation: pulse 2s infinite; }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 40px rgba(244, 63, 94, 0.5); }
            50% { transform: scale(1.05); box-shadow: 0 0 70px rgba(244, 63, 94, 0.7); }
            100% { transform: scale(1); box-shadow: 0 0 40px rgba(244, 63, 94, 0.5); }
        }

        .overlay {
            position: fixed; inset: 0; background: #020617;
            z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 20px;
        }
    </style>
</head>
<body>

    <div id="start-screen" class="overlay">
        <h1 class="title-font text-5xl md:text-7xl mb-4 text-emerald-400 text-center leading-tight">누구지:<br><span class="text-white text-3xl md:text-5xl">누군가 구할 때까지, 지구를</span></h1>
        <p id="ui-desc" class="text-slate-400 text-center mb-10 max-w-lg leading-relaxed text-lg px-4"></p>
        
        <div class="flex flex-wrap justify-center gap-3 mb-10">
            <button onclick="setLang('ko')" class="lang-btn px-6 py-3 rounded-2xl bg-slate-800 border-2 border-transparent transition-all">한국어</button>
            <button onclick="setLang('en')" class="lang-btn px-6 py-3 rounded-2xl bg-slate-800 border-2 border-transparent transition-all">English</button>
            <button onclick="setLang('th')" class="lang-btn px-6 py-3 rounded-2xl bg-slate-800 border-2 border-transparent transition-all">ไทย</button>
        </div>
        
        <button id="btn-start" onclick="startGame()" class="px-14 py-6 bg-emerald-500 rounded-3xl font-black text-2xl hover:bg-emerald-400 shadow-[0_10px_40px_rgba(52,211,153,0.3)] transition-all text-white"></button>
    </div>

    <div class="max-w-5xl mx-auto px-4 py-8">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 mb-10">
            <div class="lg:col-span-1 flex flex-col items-center justify-center bg-slate-900/50 p-8 rounded-[3rem] border border-white/5">
                <div id="earth-visual" class="earth-glow earth-green mb-6">🌍</div>
                <div class="text-center">
                    <span id="ui-earth-status" class="text-xs font-bold text-emerald-400 uppercase tracking-widest block mb-1">Earth Status</span>
                    <h3 id="earth-label" class="text-2xl font-black text-white">초록 지구</h3>
                </div>
            </div>

            <div class="lg:col-span-2 bg-slate-900/50 p-8 rounded-[3rem] border border-white/5 flex flex-col justify-between">
                <div class="flex justify-between items-end mb-4">
                    <div>
                        <span id="ui-progress-label" class="text-xs font-bold text-slate-500 uppercase tracking-widest block mb-1">Progress</span>
                        <span id="step-counter" class="text-3xl font-black text-emerald-400">01 / 30</span>
                    </div>
                    <div class="text-right">
                        <span id="ui-score-label" class="text-xs font-bold text-slate-500 uppercase tracking-widest block mb-1">Survival Rate</span>
                        <span id="health-percent" class="text-3xl font-black text-blue-400">100%</span>
                    </div>
                </div>
                <div class="h-4 w-full bg-slate-800 rounded-full overflow-hidden mb-8 border border-white/5">
                    <div id="progress-bar" class="h-full bg-gradient-to-r from-emerald-500 to-blue-500 w-0 transition-all duration-1000"></div>
                </div>
                <div id="animal-grid" class="grid grid-cols-10 gap-2"></div>
            </div>
        </div>

        <div id="game-box" class="bg-slate-900/80 p-8 md:p-14 rounded-[3rem] border border-white/10 shadow-2xl relative">
            <div id="animal-tag" class="absolute -top-6 left-1/2 -translate-x-1/2 bg-emerald-500 px-6 py-2 rounded-full font-bold shadow-xl flex items-center gap-2">
                <span id="current-animal-icon"></span>
                <span id="current-animal-name" class="text-sm"></span>
            </div>
            <h2 id="question-text" class="text-xl md:text-3xl font-bold mb-12 leading-snug text-center pt-4"></h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="options-box"></div>
        </div>
    </div>

    <div id="feedback-modal" class="fixed inset-0 bg-slate-950/98 z-50 hidden flex-col items-center justify-center p-8 text-center backdrop-blur-2xl">
        <div id="fb-icon" class="text-9xl mb-8"></div>
        <div id="fb-msg" class="text-4xl font-black mb-6 max-w-2xl"></div>
        <p id="fb-sub" class="text-xl text-slate-400 mb-12 max-w-lg leading-relaxed"></p>
        <button id="btn-next" onclick="nextQuestion()" class="px-16 py-5 bg-emerald-500 text-white font-black text-xl rounded-2xl hover:bg-emerald-400 transition-all shadow-2xl"></button>
    </div>

    <div id="result-screen" class="overlay hidden">
        <div id="final-earth" class="text-9xl mb-10">🌍</div>
        <h1 id="ui-result-title" class="title-font text-5xl mb-6 text-emerald-400"></h1>
        <div id="final-stats" class="text-6xl font-black mb-8 text-white"></div>
        <div id="final-desc" class="max-w-2xl text-center text-slate-300 mb-14 text-xl leading-relaxed px-6"></div>
        <div class="flex gap-4">
            <button id="btn-restart" onclick="location.reload()" class="px-12 py-5 bg-slate-800 rounded-2xl font-bold text-white hover:bg-slate-700 transition-all border border-white/10"></button>
        </div>
    </div>

    <script>

                    { t: { ko: "지구를 위해 남김없이 다 먹는다", en: "Eat everything for Earth", th: "กินให้หมดเพื่อโลก" }, s: 3 },
                    { t: { ko: "먹을 수 있는 만큼만 받고 나머지는 안 받는다", en: "Take only what I can eat", th: "ตักแค่ที่กินไหว" }, s: 2 },

                    { t: { ko: "양치가 끝날 때까지 물을 틀어놓는다", en: "Let water run until finished", th: "เปิดน้ำไหลทิ้งไว้จนแปรงเสร็จ" }, s: 0 }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function setLang(l) {
            lang = l;
            document.querySelectorAll('.lang-btn').forEach(btn => {
                const bLang = btn.getAttribute('onclick').match(/'(.*?)'/)[1];
                btn.classList.toggle('bg-emerald-600', bLang === lang);
                btn.classList.toggle('border-white/40', bLang === lang);
            });
            updateStaticUI();
        }

        function updateStaticUI() {
            const t = trans[lang];
            document.getElementById('ui-desc').innerText = t.desc;
            document.getElementById('btn-start').innerText = t.start;
            document.getElementById('ui-progress-label').innerText = t.progress;
            document.getElementById('ui-score-label').innerText = t.scoreLabel;
            document.getElementById('ui-earth-status').innerText = t.earthStatus;
            document.getElementById('btn-next').innerText = t.next;
            document.getElementById('ui-result-title').innerText = t.resultTitle;
            document.getElementById('btn-restart').innerText = t.restart;
            updateDynamicStatus();
        }

        function startGame() {
            document.getElementById('start-screen').classList.add('hidden');
            initAnimalGrid();
            renderQuestion();
        }

        function initAnimalGrid() {
            const grid = document.getElementById('animal-grid');
            grid.innerHTML = '';
            animals.forEach((a, i) => {
                const div = document.createElement('div');
                div.className = "animal-slot";
                div.id = `animal-${i}`;
                div.innerText = a.i;
                grid.appendChild(div);
            });
        }

        function renderQuestion() {
            if (currentStep >= 30) {
                showResult();
                return;
            }
            const q = questions[currentStep];
            const a = animals[currentStep];
            
            document.getElementById('step-counter').innerText = `${String(currentStep + 1).padStart(2, '0')} / 30`;
            document.getElementById('progress-bar').style.width = `${((currentStep+1)/30)*100}%`;
            
            document.getElementById('current-animal-icon').innerText = a.i;
            document.getElementById('current-animal-name').innerText = a.n[lang];
            document.getElementById('question-text').innerText = q.q[lang];
            
            const optionsBox = document.getElementById('options-box');
            optionsBox.innerHTML = '';
            
            const shuffledOptions = shuffle([...q.o]);
            
            shuffledOptions.forEach((opt) => {
                const b = document.createElement('button');
                b.className = "option-btn p-5 rounded-3xl font-bold flex flex-col justify-center items-center text-center gap-2 text-sm md:text-base";
                b.innerHTML = `<span>${opt.t[lang]}</span>`;
                b.onclick = () => handleChoice(opt.s);
                optionsBox.appendChild(b);
            });
            
            updateDynamicStatus();
        }

        function handleChoice(score) {
            totalScore += score;
            const slot = document.getElementById(`animal-${currentStep}`);
            slot.classList.add(`status-${score}`);
            
            const t = trans[lang];
            document.getElementById('fb-icon').innerText = animals[currentStep].i;
            document.getElementById('fb-msg').innerText = t[`level${score}`];
            document.getElementById('fb-sub').innerText = t[`sub${score}`];
            
            const msgEl = document.getElementById('fb-msg');
            const colors = ["text-rose-500", "text-amber-500", "text-blue-400", "text-emerald-400"];
            msgEl.className = `text-4xl font-black mb-6 max-w-2xl ${colors[score]}`;

            document.getElementById('feedback-modal').classList.remove('hidden');
            document.getElementById('feedback-modal').style.display = 'flex';
        }

        function nextQuestion() {
            document.getElementById('feedback-modal').classList.add('hidden');
            document.getElementById('feedback-modal').style.display = 'none';
            currentStep++;
            renderQuestion();
        }

        function updateDynamicStatus() {
            const possibleScore = (currentStep + 1) * 3;
            const survivalRate = Math.round((totalScore / (possibleScore || 1)) * 100);
            document.getElementById('health-percent').innerText = `${survivalRate}%`;
            
            const earthVisual = document.getElementById('earth-visual');
            const earthLabel = document.getElementById('earth-label');
            
            if (survivalRate < 60) {
                earthVisual.className = "earth-glow earth-red";
                earthVisual.innerText = "🔥";
                earthLabel.innerText = trans[lang].earthRed;
                earthLabel.classList.add('text-rose-500');
            } else {
                earthVisual.className = "earth-glow earth-green";
                earthVisual.innerText = "🌍";
                earthLabel.innerText = trans[lang].earthGreen;
                earthLabel.classList.remove('text-rose-500');
            }
        }

        function showResult() {
            document.getElementById('result-screen').classList.remove('hidden');
            const finalPercent = Math.round((totalScore / 90) * 100);
            document.getElementById('final-stats').innerText = `${trans[lang].survivalIdx}: ${finalPercent}%`;
            
            let finalIcon = "🌍";
            let desc = "";
            if (finalPercent > 85) {
                finalIcon = "🌳";
                desc = trans[lang].resGood;
            } else if (finalPercent > 50) {
                finalIcon = "⚠️";
                desc = trans[lang].resAvg;
            } else {
                finalIcon = "🔥";
                desc = trans[lang].resBad;
            }
            
            document.getElementById('final-earth').innerText = finalIcon;
            document.getElementById('final-desc').innerText = desc;
        }
